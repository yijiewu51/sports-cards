th .sort-arrow { margin-left: 4px; font-size: 10px; color: #aaa; }

.badge-sold { background: #dcfce7; color: #15803d; }
.badge-uk { background: #fef3c7; color: #b45309; }
.badge-xx { background: #ede9fe; color: #7c3aed; }

.badge-katao { background: #e0f2fe; color: #0369a1; }

// Load saved edits from localStorage
const savedEdits = JSON.parse(localStorage.getItem('cardEdits') || '{}');
cards.forEach(c => {
  if (savedEdits[c.id]) {
    if (savedEdits[c.id].costCNY !== undefined) c.costCNY = savedEdits[c.id].costCNY;
    if (savedEdits[c.id].soldPrice !== undefined) c.soldPrice = savedEdits[c.id].soldPrice;
  }
});

function saveEdits() {
  const edits = {};
  cards.forEach(c => { edits[c.id] = { costCNY: c.costCNY, soldPrice: c.soldPrice }; });
  localStorage.setItem('cardEdits', JSON.stringify(edits));
}

let currentTab = 'all';
let sortCol = null;
let sortDir = 'asc';

function getBreakeven(c) {
  if (!c.costCNY) return null;
  if (c.source === 'eBay') return c.costCNY / 0.935;
  return null;
}

function getProfit(c) {
  if (c.soldPrice == null || c.costCNY == null) return null;
  return c.soldPrice - c.costCNY;
}

function getFiltered() {
  const search = document.getElementById('searchInput').value.toLowerCase();
  const buyer = document.getElementById('filterBuyer').value;
  const status = document.getElementById('filterStatus').value;
  const special = document.getElementById('filterRC').value;

  return cards.filter(c => {
    if (currentTab === 'katao' && c.source !== '卡淘') return false;
    if (currentTab === 'ebay' && c.source !== 'eBay' && c.source !== '卡展') return false;
    if (buyer && c.buyer !== buyer) return false;
    if (status && c.status !== status) return false;
    if (special === 'rc' && !c.rc) return false;
    if (special === 'sign' && !c.sign) return false;
    if (special === 'mat' && !c.mat) return false;
    if (search) {
      const hay = [c.id,c.player,c.series,c.year,c.number,c.buyer,c.source,c.note].join(' ').toLowerCase();
      if (!hay.includes(search)) return false;
    }
    return true;
  });
}

function sortData(data) {
  // Split into active and sold (有成交价的也算已售出)
  const active = data.filter(c => c.status !== '已售出' && c.soldPrice == null);
  const sold = data.filter(c => c.status === '已售出' || c.soldPrice != null);

  if (sortCol) {
    const sorter = (a, b) => {
      let va = sortCol === 'breakeven' ? getBreakeven(a) : sortCol === 'profit' ? getProfit(a) : a[sortCol];
      let vb = sortCol === 'breakeven' ? getBreakeven(b) : sortCol === 'profit' ? getProfit(b) : b[sortCol];
      if (va == null) va = typeof vb === 'number' ? -Infinity : '';
      if (vb == null) vb = typeof va === 'number' ? -Infinity : '';
      if (typeof va === 'number' && typeof vb === 'number') return sortDir === 'asc' ? va - vb : vb - va;
      if (typeof va === 'boolean') return sortDir === 'asc' ? (va === vb ? 0 : va ? -1 : 1) : (va === vb ? 0 : va ? 1 : -1);
      return sortDir === 'asc' ? String(va).localeCompare(String(vb)) : String(vb).localeCompare(String(va));
    };
    active.sort(sorter);
    sold.sort(sorter);
  }

  return { active, sold };
}

const columns = [
  {key:'id', label:'ID'},
  {key:'player', label:'球员'},
  {key:'series', label:'系列'},
  {key:'year', label:'年份'},
  {key:'rc', label:'RC'},
  {key:'sign', label:'签名'},
  {key:'mat', label:'物料'},
  {key:'number', label:'编号'},
  {key:'buyer', label:'购买人'},
  {key:'source', label:'来源'},
  {key:'costCNY', label:'成本 ¥', editable: true},
  {key:'breakeven', label:'回本价'},
  {key:'soldPrice', label:'成交价', editable: true},
  {key:'profit', label:'利润 ¥'},
  {key:'status', label:'状态'},
  {key:'note', label:'备注'},
];

function renderHead() {
  const tr = document.createElement('tr');
  columns.forEach(col => {
    const th = document.createElement('th');
    th.innerHTML = col.label + '<span class="sort-arrow"></span>';
    if (sortCol === col.key) th.classList.add(sortDir === 'asc' ? 'sorted-asc' : 'sorted-desc');
    th.onclick = () => {
      if (sortCol === col.key) sortDir = sortDir === 'asc' ? 'desc' : 'asc';
      else { sortCol = col.key; sortDir = 'asc'; }
      renderTable();
    };
    tr.appendChild(th);
  });
  document.getElementById('tableHead').innerHTML = '';
  document.getElementById('tableHead').appendChild(tr);
}

function fmtMoney(v) {
  if (v == null || v === '') return '-';
  return '\u00A5' + Number(v).toFixed(2);
}

function makeEditableCell(card, field, value) {
  const td = document.createElement('td');
  td.className = 'editable-cell';
  td.textContent = value != null ? fmtMoney(value) : '-';
  td.ondblclick = function() {
    if (td.querySelector('input')) return;
    const input = document.createElement('input');
    input.type = 'number';
    input.step = '0.01';
    input.value = value != null ? value : '';
    input.placeholder = '输入金额';
    td.textContent = '';
    td.appendChild(input);
    input.focus();
    input.select();

    const commit = () => {
      const raw = input.value.trim();
      if (raw === '') {
        card[field] = null;
      } else {
        card[field] = parseFloat(raw);
      }
      saveEdits();
      renderTable();
    };
    input.onblur = commit;
    input.onkeydown = (e) => {
      if (e.key === 'Enter') { e.preventDefault(); commit(); }
      if (e.key === 'Escape') { renderTable(); }
    };
  };
  return td;
}

function buildRow(c, isSold) {
  const tr = document.createElement('tr');
  if (isSold) tr.className = 'row-sold';
  const profit = getProfit(c);
  const breakeven = getBreakeven(c);

  columns.forEach(col => {
    if (col.key === 'costCNY') {
      tr.appendChild(makeEditableCell(c, 'costCNY', c.costCNY));
      return;
    }
    if (col.key === 'soldPrice') {
      tr.appendChild(makeEditableCell(c, 'soldPrice', c.soldPrice));
      return;
    }
    const td = document.createElement('td');
    const v = col.key === 'breakeven' ? breakeven : col.key === 'profit' ? profit : c[col.key];
    switch(col.key) {
      case 'rc': td.innerHTML = v ? '<span class="rc-yes">RC</span>' : ''; break;
      case 'sign': td.innerHTML = v ? '<span class="sign-yes">签</span>' : ''; break;
      case 'mat': td.innerHTML = v ? '<span class="mat-yes">物料</span>' : ''; break;
      case 'breakeven':
        td.textContent = v != null ? fmtMoney(v) : '-';
        td.style.color = '#6b7280';
        break;
      case 'profit':
        if (v != null) {
          td.textContent = fmtMoney(v);
          if (!isSold) td.className = v >= 0 ? 'profit-cell-pos' : 'profit-cell-neg';
        } else { td.textContent = '-'; }
        break;
      case 'status':
        const cls = v === '已售出' ? 'badge-sold' : v === '在英国' || v === '带回英国' ? 'badge-uk' : 'badge-holding';
        td.innerHTML = '<span class="badge ' + cls + '">' + (v||'-') + '</span>';
        break;
      case 'buyer':
        if (v === '香香') td.innerHTML = '<span class="badge badge-xx">香香</span>';
        else if (v === '小桃子') td.innerHTML = '<span class="badge badge-xtz">小桃子</span>';
        else td.textContent = v || '-';
        break;
      case 'source':
        if (v === '卡淘') td.innerHTML = '<span class="badge badge-katao">卡淘</span>';
        else if (v === 'eBay') td.innerHTML = '<span class="badge badge-ebay">eBay</span>';
        else if (v === '卡展') td.innerHTML = '<span class="badge badge-kazhan">卡展</span>';
        else td.textContent = v || '-';
        break;
      default: td.textContent = v || '-'; break;
    }
    tr.appendChild(td);
  });
  return tr;
}

function renderTable() {
  const filtered = getFiltered();
  const { active, sold } = sortData(filtered);
  renderHead();
  updateStats(filtered);
  const tbody = document.getElementById('tableBody');
  tbody.innerHTML = '';
  document.getElementById('emptyState').style.display = (active.length + sold.length) ? 'none' : 'block';

  active.forEach(c => tbody.appendChild(buildRow(c, false)));

  if (sold.length > 0) {
    const divider = document.createElement('tr');
    divider.className = 'sold-divider';
    const dtd = document.createElement('td');
    dtd.colSpan = columns.length;
    dtd.textContent = '-- 已售出 (' + sold.length + ') --';
    divider.appendChild(dtd);
    tbody.appendChild(divider);
    sold.forEach(c => tbody.appendChild(buildRow(c, true)));
  }
}

function updateStats(filtered) {
  const all = filtered;
  const holding = all.filter(c => c.status !== '已售出' && c.soldPrice == null);
  const sold = all.filter(c => c.status === '已售出' || c.soldPrice != null);
  const totalCost = all.reduce((s,c) => s + (c.costCNY || 0), 0);
  const holdingCost = holding.reduce((s,c) => s + (c.costCNY || 0), 0);
  const totalProfit = all.map(getProfit).filter(p => p != null).reduce((s,p) => s + p, 0);

  const stats = [
    {label:'总卡数', value: all.length, sub: '持有 ' + holding.length + ' / 已售 ' + sold.length},
    {label:'总成本', value: fmtMoney(totalCost), sub: '持仓 ' + fmtMoney(holdingCost)},
    {label:'已实现利润', value: fmtMoney(totalProfit), sub: sold.length + ' 笔已结算', cls: totalProfit >= 0 ? 'profit-pos' : 'profit-neg'},
    {label:'香香卡数', value: all.filter(c=>c.buyer==='香香').length, sub: '成本 ' + fmtMoney(all.filter(c=>c.buyer==='香香').reduce((s,c)=>s+(c.costCNY||0),0))},
    {label:'小桃子卡数', value: all.filter(c=>c.buyer==='小桃子').length, sub: '成本 ' + fmtMoney(all.filter(c=>c.buyer==='小桃子').reduce((s,c)=>s+(c.costCNY||0),0))},
  ];

  document.getElementById('statsRow').innerHTML = stats.map(s =>
    '<div class="stat-card"><div class="label">' + s.label + '</div><div class="value ' + (s.cls||'') + '">' + s.value + '</div><div class="sub">' + s.sub + '</div></div>'
  ).join('');
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  renderTable();
}

renderTable();
</script>
