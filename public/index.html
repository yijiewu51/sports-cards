<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>球星卡库存总览 - 香香 x 小桃子</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f2f5; color: #333; }
.header { background: linear-gradient(135deg, #1a1a2e, #16213e); color: #fff; padding: 24px 32px; display: flex; justify-content: space-between; align-items: center; }
.header h1 { font-size: 24px; font-weight: 600; }
.header p { color: #94a3b8; margin-top: 4px; font-size: 14px; }
.header-actions { display: flex; gap: 10px; }
.btn { padding: 8px 18px; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all .15s; }
.btn-primary { background: #3b82f6; color: #fff; }
.btn-primary:hover { background: #2563eb; }
.btn-sm { padding: 5px 12px; font-size: 12px; }
.btn-outline { background: transparent; border: 1px solid rgba(255,255,255,.3); color: #fff; }
.btn-outline:hover { background: rgba(255,255,255,.1); }

.stats-row { display: flex; gap: 16px; padding: 20px 32px; flex-wrap: wrap; }
.stat-card { background: #fff; border-radius: 12px; padding: 18px 22px; flex: 1; min-width: 140px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.stat-card .label { font-size: 12px; color: #888; letter-spacing: .5px; }
.stat-card .value { font-size: 24px; font-weight: 700; margin-top: 4px; }
.stat-card .sub { font-size: 12px; color: #999; margin-top: 2px; }
.profit-pos { color: #16a34a; }
.profit-neg { color: #dc2626; }

.controls { padding: 12px 32px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.controls select, .controls input[type="text"] { padding: 8px 14px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; background: #fff; outline: none; }
.controls select:focus, .controls input[type="text"]:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,.15); }
.controls input[type="text"] { width: 220px; }
.tab-bar { display: flex; gap: 0; padding: 0 32px; }
.tab { padding: 10px 24px; cursor: pointer; font-size: 14px; font-weight: 500; border-bottom: 2px solid transparent; color: #666; transition: all .2s; }
.tab:hover { color: #333; }
.tab.active { color: #3b82f6; border-bottom-color: #3b82f6; }

.table-wrap { padding: 0 32px 32px; overflow-x: auto; }
table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.08); font-size: 13px; }
thead { background: #f8fafc; }
th { padding: 12px 14px; text-align: left; font-weight: 600; color: #555; white-space: nowrap; border-bottom: 2px solid #e5e7eb; cursor: pointer; user-select: none; }
th:hover { background: #f1f5f9; }
th .sort-arrow { margin-left: 4px; font-size: 10px; color: #aaa; }
th.sorted-asc .sort-arrow::after { content: ' \u25B2'; color: #3b82f6; }
th.sorted-desc .sort-arrow::after { content: ' \u25BC'; color: #3b82f6; }
td { padding: 10px 14px; border-bottom: 1px solid #f1f3f5; white-space: nowrap; }
tr:hover td { background: #f8fafc; }
tr.row-sold td { background: #f9fafb; color: #aaa; }
tr.row-sold:hover td { background: #f3f4f6; color: #aaa; }
tr.row-sold .badge { opacity: .5; }
tr.row-sold .rc-yes, tr.row-sold .sign-yes, tr.row-sold .mat-yes { color: #ccc; }
.sold-divider td { background: #e5e7eb; padding: 6px 14px; font-size: 12px; font-weight: 600; color: #888; letter-spacing: .5px; }

.badge { padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 600; display: inline-block; }
.badge-holding { background: #dbeafe; color: #1d4ed8; }
.badge-sold { background: #dcfce7; color: #15803d; }
.badge-uk { background: #fef3c7; color: #b45309; }
.badge-xx { background: #ede9fe; color: #7c3aed; }
.badge-xtz { background: #fce7f3; color: #be185d; }
.badge-katao { background: #e0f2fe; color: #0369a1; }
.badge-ebay { background: #fef9c3; color: #a16207; }
.badge-kazhan { background: #f3e8ff; color: #7e22ce; }
.rc-yes { color: #16a34a; font-weight: 700; }
.sign-yes { color: #d97706; font-weight: 700; }
.mat-yes { color: #7c3aed; font-weight: 700; }
.profit-cell-pos { color: #16a34a; font-weight: 600; }
.profit-cell-neg { color: #dc2626; font-weight: 600; }
.empty-state { text-align: center; padding: 60px 20px; color: #999; }
.footer { text-align: center; padding: 20px; color: #aaa; font-size: 12px; }

.editable-cell { position: relative; cursor: text; min-width: 70px; }
.editable-cell:hover { background: #eef2ff !important; }
.editable-cell input { width: 80px; padding: 2px 6px; border: 1px solid #3b82f6; border-radius: 4px; font-size: 13px; outline: none; background: #fff; }

/* Modal */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: flex; align-items: center; justify-content: center; z-index: 1000; }
.modal { background: #fff; border-radius: 16px; padding: 28px; width: 480px; max-width: 95vw; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,.2); }
.modal h2 { font-size: 18px; margin-bottom: 16px; }
.modal .form-row { margin-bottom: 12px; }
.modal label { display: block; font-size: 13px; font-weight: 500; color: #555; margin-bottom: 4px; }
.modal input, .modal select, .modal textarea { width: 100%; padding: 8px 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; outline: none; }
.modal input:focus, .modal select:focus { border-color: #3b82f6; }
.modal .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.modal .checkbox-row { display: flex; gap: 20px; align-items: center; margin: 12px 0; }
.modal .checkbox-row label { display: flex; align-items: center; gap: 6px; cursor: pointer; margin-bottom: 0; }
.modal .checkbox-row input[type="checkbox"] { width: auto; }
.modal .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
.modal .btn-cancel { background: #f3f4f6; color: #333; }
.modal .btn-cancel:hover { background: #e5e7eb; }
.sync-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }
.sync-dot.online { background: #22c55e; }
.sync-dot.offline { background: #ef4444; }

/* Setup modal */
.setup-steps { margin: 16px 0; }
.setup-steps li { margin-bottom: 10px; font-size: 14px; line-height: 1.6; }
.setup-steps code { background: #f1f5f9; padding: 2px 6px; border-radius: 4px; font-size: 12px; }
.sql-block { background: #1e293b; color: #e2e8f0; padding: 14px; border-radius: 8px; font-size: 12px; white-space: pre-wrap; word-break: break-all; margin: 10px 0; font-family: monospace; position: relative; }
.sql-block .copy-btn { position: absolute; top: 8px; right: 8px; background: #475569; color: #fff; border: none; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 11px; }
.sql-block .copy-btn:hover { background: #64748b; }
.edit-btn { background: none; border: 1px solid #d1d5db; border-radius: 6px; padding: 3px 8px; cursor: pointer; font-size: 11px; color: #666; transition: all .15s; }
.edit-btn:hover { background: #3b82f6; color: #fff; border-color: #3b82f6; }
tr.row-sold .edit-btn { opacity: .4; }
.currency-input-wrap { display: flex; gap: 0; align-items: center; }
.currency-input-wrap input { border-radius: 4px 0 0 4px !important; border-right: none !important; }
.currency-toggle { padding: 2px 8px; border: 1px solid #3b82f6; border-radius: 0 4px 4px 0; background: #eef2ff; cursor: pointer; font-size: 12px; font-weight: 700; color: #3b82f6; white-space: nowrap; user-select: none; min-width: 28px; text-align: center; }
.currency-toggle:hover { background: #3b82f6; color: #fff; }
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>球星卡库存总览</h1>
    <p>香香 x 小桃子 | <span class="sync-dot online" id="syncDot"></span><span id="syncStatus">已连接</span></p>
  </div>
  <div class="header-actions">
    <button class="btn btn-primary" onclick="showAddModal()">+ 新增卡牌</button>
  </div>
</div>

<div class="stats-row" id="statsRow"></div>

<div class="tab-bar">
  <div class="tab active" data-tab="all" onclick="switchTab('all')">全部</div>
  <div class="tab" data-tab="katao" onclick="switchTab('katao')">卡淘购入</div>
  <div class="tab" data-tab="ebay" onclick="switchTab('ebay')">eBay购入</div>
  <div class="tab" data-tab="settle" onclick="switchTab('settle')">结算</div>
</div>

<div class="controls" id="mainControls">
  <input type="text" id="searchInput" placeholder="搜索球员、系列、编号..." oninput="renderTable()">
  <select id="filterBuyer" onchange="renderTable()">
    <option value="">全部购买人</option>
    <option value="香香">香香</option>
    <option value="小桃子">小桃子</option>
  </select>
  <select id="filterStatus" onchange="renderTable()">
    <option value="">全部状态</option>
    <option value="持有">持有</option>
    <option value="已售出">已售出</option>
    <option value="在英国">在英国</option>
    <option value="带回英国">带回英国</option>
  </select>
  <select id="filterRC" onchange="renderTable()">
    <option value="">RC/签名/物料</option>
    <option value="rc">RC 新秀</option>
    <option value="sign">签名</option>
    <option value="mat">物料(球衣)</option>
  </select>
</div>

<div class="table-wrap">
  <table>
    <thead id="tableHead"></thead>
    <tbody id="tableBody"></tbody>
  </table>
  <div class="empty-state" id="emptyState" style="display:none;">没有匹配的记录</div>
</div>

<!-- Settlement Page -->
<div id="settlePage" style="display:none; padding: 0 32px 32px;">
  <div class="stats-row" id="settleStats"></div>
  <table>
    <thead>
      <tr>
        <th style="width:50px;cursor:default;"></th>
        <th>ID</th><th>球员</th><th>系列</th><th>购买人</th><th>来源</th>
        <th>成本</th><th>成交价</th><th>利润</th>
        <th>购买人回收</th><th>香香分润</th><th>小桃子分润</th>
        <th>状态</th>
      </tr>
    </thead>
    <tbody id="settleBody"></tbody>
  </table>
</div>

<div class="footer">eBay回本价 = 成本 / 0.935</div>

<!-- Add Card Modal -->
<div class="modal-overlay" id="addModal" style="display:none;" onclick="if(event.target===this)closeAddModal()">
<div class="modal">
  <h2>新增卡牌</h2>
  <div class="form-grid">
    <div class="form-row"><label>球员 *</label><input id="f_player" placeholder="球员名"></div>
    <div class="form-row"><label>系列</label><input id="f_series" placeholder="Chrome / Prizm..."></div>
    <div class="form-row"><label>年份</label><input id="f_year" placeholder="2025-26"></div>
    <div class="form-row"><label>编号</label><input id="f_number" placeholder="/99"></div>
    <div class="form-row"><label>购买人</label>
      <select id="f_buyer"><option value="香香">香香</option><option value="小桃子">小桃子</option><option value="">未分配</option></select>
    </div>
    <div class="form-row"><label>来源</label>
      <select id="f_source" onchange="updateCostLabel()"><option value="卡淘">卡淘</option><option value="eBay">eBay</option><option value="卡展">卡展</option></select>
    </div>
    <div class="form-row"><label id="f_cost_label">成本 (CNY \u00A5)</label><input id="f_cost" type="number" step="0.01" placeholder="0"></div>
    <div class="form-row"><label>状态</label>
      <select id="f_status"><option value="持有">持有</option><option value="在英国">在英国</option><option value="带回英国">带回英国</option></select>
    </div>
  </div>
  <div class="checkbox-row">
    <label><input type="checkbox" id="f_rc"> RC 新秀</label>
    <label><input type="checkbox" id="f_sign"> 签名</label>
    <label><input type="checkbox" id="f_mat"> 物料</label>
  </div>
  <div class="form-row"><label>备注</label><input id="f_note" placeholder="备注信息"></div>
  <div class="modal-actions">
    <button class="btn btn-cancel" onclick="closeAddModal()">取消</button>
    <button class="btn btn-primary" onclick="submitNewCard()">添加</button>
  </div>
</div>
</div>

<!-- Edit Card Modal -->
<div class="modal-overlay" id="editModal" style="display:none;" onclick="if(event.target===this)closeEditModal()">
<div class="modal">
  <h2>编辑卡牌 <span id="e_id" style="color:#999;font-size:14px;"></span></h2>
  <div class="form-grid">
    <div class="form-row"><label>球员</label><input id="e_player"></div>
    <div class="form-row"><label>系列</label><input id="e_series"></div>
    <div class="form-row"><label>年份</label><input id="e_year"></div>
    <div class="form-row"><label>编号</label><input id="e_number"></div>
    <div class="form-row"><label>购买人</label>
      <select id="e_buyer"><option value="香香">香香</option><option value="小桃子">小桃子</option><option value="">未分配</option></select>
    </div>
    <div class="form-row"><label>来源</label>
      <select id="e_source" onchange="updateEditCostLabel()"><option value="卡淘">卡淘</option><option value="eBay">eBay</option><option value="卡展">卡展</option></select>
    </div>
    <div class="form-row"><label id="e_cost_label">成本</label><input id="e_cost" type="number" step="0.01"></div>
    <div class="form-row"><label>成交价 (CNY)</label><input id="e_sold" type="number" step="0.01"></div>
    <div class="form-row"><label>状态</label>
      <select id="e_status"><option value="持有">持有</option><option value="已售出">已售出</option><option value="在英国">在英国</option><option value="带回英国">带回英国</option></select>
    </div>
    <div class="form-row"><label>备注</label><input id="e_note"></div>
  </div>
  <div class="checkbox-row">
    <label><input type="checkbox" id="e_rc"> RC 新秀</label>
    <label><input type="checkbox" id="e_sign"> 签名</label>
    <label><input type="checkbox" id="e_mat"> 物料</label>
  </div>
  <div class="modal-actions">
    <button class="btn btn-cancel" onclick="closeEditModal()">取消</button>
    <button class="btn btn-primary" onclick="submitEditCard()">保存</button>
  </div>
</div>
</div>

// ==================== STATE ====================
let cards = [];
let currentTab = 'all';
let sortCol = null;
let sortDir = 'asc';

// ==================== API ====================
async function loadCards() {
  try {
    const res = await fetch('/api/cards');
    cards = await res.json();
    if (currentTab === 'settle') renderSettlePage();
    else renderTable();
  } catch(e) {
    console.error('Failed to load cards:', e);
  }
}

async function updateCard(id, fields) {
  const card = cards.find(c => c.id === id);
  if (!card) return;
  Object.assign(card, fields);
  renderTable();
  await fetch('/api/cards/' + encodeURIComponent(id), {
    method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify(fields)
  });
}

async function insertCard(card) {
  cards.push(card);
  renderTable();
  await fetch('/api/cards', {
    method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(card)
  });
}

// Real-time sync via SSE
function connectSSE() {
  const es = new EventSource('/api/events');
  es.onmessage = (e) => { if (e.data === 'update') loadCards(); };
  es.onerror = () => {
    document.getElementById('syncDot').className = 'sync-dot offline';
    document.getElementById('syncStatus').textContent = '连接断开，重连中...';
    es.close();
    setTimeout(connectSSE, 3000);
  };
  es.onopen = () => {
    document.getElementById('syncDot').className = 'sync-dot online';
    document.getElementById('syncStatus').textContent = '已连接';
  };
}

function nextId(prefix) {
  const nums = cards.filter(c => c.id.startsWith(prefix)).map(c => parseInt(c.id.replace(prefix, '')) || 0);
  const next = (nums.length ? Math.max(...nums) : 0) + 1;
  return prefix + String(next).padStart(3, '0');
}

// ==================== TABLE LOGIC ====================
function isSold(c) { return c.status === '已售出' || c.sold_price != null; }
function getBreakeven(c) { return c.source === 'eBay' && c.cost_cny ? c.cost_cny / 0.935 : null; }
function getProfit(c) { return c.sold_price != null && c.cost_cny != null ? c.sold_price - c.cost_cny : null; }

function getFiltered() {
  const search = document.getElementById('searchInput').value.toLowerCase();
  const buyer = document.getElementById('filterBuyer').value;
  const statusF = document.getElementById('filterStatus').value;
  const special = document.getElementById('filterRC').value;

  return cards.filter(c => {
    if (currentTab === 'katao' && c.source !== '卡淘') return false;
    if (currentTab === 'ebay' && c.source !== 'eBay' && c.source !== '卡展') return false;
    if (buyer && c.buyer !== buyer) return false;
    if (statusF) {
      if (statusF === '已售出') { if (!isSold(c)) return false; }
      else { if (c.status !== statusF || isSold(c)) return false; }
    }
    if (special === 'rc' && !c.rc) return false;
    if (special === 'sign' && !c.sign) return false;
    if (special === 'mat' && !c.mat) return false;
    if (search) {
      const hay = [c.id,c.player,c.series,c.year,c.number,c.buyer,c.source,c.note].join(' ').toLowerCase();
      if (!hay.includes(search)) return false;
    }
    return true;
  });
}

function splitAndSort(data) {
  const active = data.filter(c => !isSold(c));
  const sold = data.filter(c => isSold(c));
  if (sortCol) {
    const sorter = (a, b) => {
      let va = sortCol === 'breakeven' ? getBreakeven(a) : sortCol === 'profit' ? getProfit(a) : a[sortCol];
      let vb = sortCol === 'breakeven' ? getBreakeven(b) : sortCol === 'profit' ? getProfit(b) : b[sortCol];
      if (va == null) va = typeof vb === 'number' ? -Infinity : '';
      if (vb == null) vb = typeof va === 'number' ? -Infinity : '';
      if (typeof va === 'number' && typeof vb === 'number') return sortDir === 'asc' ? va - vb : vb - va;
      if (typeof va === 'boolean') return sortDir === 'asc' ? (va === vb ? 0 : va ? -1 : 1) : (va === vb ? 0 : va ? 1 : -1);
      return sortDir === 'asc' ? String(va).localeCompare(String(vb)) : String(vb).localeCompare(String(va));
    };
    active.sort(sorter);
    sold.sort(sorter);
  }
  return { active, sold };
}

function fmtMoney(v) {
  if (v == null || v === '') return '-';
  return '\u00A5' + Number(v).toFixed(2);
}

function renderHead() {
  const tr = document.createElement('tr');
  columns.forEach(col => {
    const th = document.createElement('th');
    if (col.key === '_edit') { th.style.width = '50px'; th.style.cursor = 'default'; tr.appendChild(th); return; }
    th.innerHTML = col.label + '<span class="sort-arrow"></span>';
    if (sortCol === col.key) th.classList.add(sortDir === 'asc' ? 'sorted-asc' : 'sorted-desc');
    th.onclick = () => {
      if (sortCol === col.key) sortDir = sortDir === 'asc' ? 'desc' : 'asc';
      else { sortCol = col.key; sortDir = 'asc'; }
      renderTable();
    };
    tr.appendChild(th);
  });
  document.getElementById('tableHead').innerHTML = '';
  document.getElementById('tableHead').appendChild(tr);
}

function isGBP(card, field) {
  return field === 'cost_cny' && (card.source === 'eBay' || card.source === '卡展');
}

function fmtCost(card, field, value) {
  if (value == null) return '-';
  if (isGBP(card, field)) return '\u00A3' + (value / 9).toFixed(2);
  return '\u00A5' + Number(value).toFixed(2);
}

function makeEditableCell(card, field, value) {
  const td = document.createElement('td');
  td.className = 'editable-cell';
  const gbp = isGBP(card, field);
  td.textContent = value != null ? (field === 'cost_cny' ? fmtCost(card, field, value) : fmtMoney(value)) : '-';
  td.ondblclick = function() {
    if (td.querySelector('input')) return;
    td.textContent = '';

    const isSoldField = field === 'sold_price';
    let useGBP = gbp; // cost always follows source; sold_price defaults to CNY

    const input = document.createElement('input');
    input.type = 'number';
    input.step = '0.01';
    input.value = value != null ? (useGBP ? (value / 9).toFixed(2) : value) : '';
    input.placeholder = useGBP ? '英镑金额' : '人民币金额';

    const commit = () => {
      const raw = input.value.trim();
      let newVal = raw === '' ? null : parseFloat(raw);
      if (newVal != null && useGBP) newVal = newVal * 9;
      updateCard(card.id, { [field]: newVal });
    };
    input.onkeydown = (e) => {
      if (e.key === 'Enter') { e.preventDefault(); commit(); }
      if (e.key === 'Escape') renderTable();
    };

    if (isSoldField) {
      // Wrap input + currency toggle button
      const wrap = document.createElement('div');
      wrap.className = 'currency-input-wrap';
      const toggle = document.createElement('div');
      toggle.className = 'currency-toggle';
      toggle.textContent = '\u00A5';
      toggle.title = '点击切换 \u00A5/\u00A3';
      toggle.onclick = (e) => {
        e.stopPropagation();
        const curVal = input.value.trim();
        if (useGBP) {
          // switching GBP -> CNY: convert displayed value
          useGBP = false;
          toggle.textContent = '\u00A5';
          if (curVal) input.value = (parseFloat(curVal) * 9).toFixed(2);
          input.placeholder = '人民币金额';
        } else {
          // switching CNY -> GBP
          useGBP = true;
          toggle.textContent = '\u00A3';
          if (curVal) input.value = (parseFloat(curVal) / 9).toFixed(2);
          input.placeholder = '英镑金额';
        }
        input.focus();
      };
      wrap.appendChild(input);
      wrap.appendChild(toggle);
      td.appendChild(wrap);
      // prevent blur commit when clicking toggle
      input.onblur = (e) => {
        if (e.relatedTarget === toggle || td.contains(e.relatedTarget)) return;
        commit();
      };
      toggle.tabIndex = 0;
    } else {
      td.appendChild(input);
      input.onblur = commit;
    }
    input.focus();
    input.select();
  };
  return td;
}

function buildRow(c, sold) {
  const tr = document.createElement('tr');
  if (sold) tr.className = 'row-sold';
  const profit = getProfit(c);
  const breakeven = getBreakeven(c);

  columns.forEach(col => {
    if (col.key === '_edit') {
      const td = document.createElement('td');
      const btn = document.createElement('button');
      btn.className = 'edit-btn';
      btn.textContent = '编辑';
      btn.onclick = () => showEditModal(c.id);
      td.appendChild(btn);
      tr.appendChild(td);
      return;
    }
    if (col.key === 'cost_cny') { tr.appendChild(makeEditableCell(c, 'cost_cny', c.cost_cny)); return; }
    if (col.key === 'sold_price') { tr.appendChild(makeEditableCell(c, 'sold_price', c.sold_price)); return; }
    const td = document.createElement('td');
    const v = col.key === 'breakeven' ? breakeven : col.key === 'profit' ? profit : c[col.key];
    switch(col.key) {
      case 'rc': td.innerHTML = v ? '<span class="rc-yes">RC</span>' : ''; break;
      case 'sign': td.innerHTML = v ? '<span class="sign-yes">签</span>' : ''; break;
      case 'mat': td.innerHTML = v ? '<span class="mat-yes">物料</span>' : ''; break;
      case 'breakeven': td.textContent = v != null ? fmtMoney(v) : '-'; td.style.color = '#6b7280'; break;
      case 'profit':
        if (v != null) { td.textContent = fmtMoney(v); if (!sold) td.className = v >= 0 ? 'profit-cell-pos' : 'profit-cell-neg'; }
        else td.textContent = '-';
        break;
      case 'status':
        const cls = isSold(c) ? 'badge-sold' : v === '在英国' || v === '带回英国' ? 'badge-uk' : 'badge-holding';
        td.innerHTML = '<span class="badge ' + cls + '">' + (isSold(c) ? '已售出' : v || '-') + '</span>';
        break;
      case 'buyer':
        if (v === '香香') td.innerHTML = '<span class="badge badge-xx">香香</span>';
        else if (v === '小桃子') td.innerHTML = '<span class="badge badge-xtz">小桃子</span>';
        else td.textContent = v || '-';
        break;
      case 'source':
        if (v === '卡淘') td.innerHTML = '<span class="badge badge-katao">卡淘</span>';
        else if (v === 'eBay') td.innerHTML = '<span class="badge badge-ebay">eBay</span>';
        else if (v === '卡展') td.innerHTML = '<span class="badge badge-kazhan">卡展</span>';
        else td.textContent = v || '-';
        break;
      default: td.textContent = v || '-'; break;
    }
    tr.appendChild(td);
  });
  return tr;
}

function renderTable() {
  const filtered = getFiltered();
  const { active, sold } = splitAndSort(filtered);
  renderHead();
  updateStats(filtered);
  const tbody = document.getElementById('tableBody');
  tbody.innerHTML = '';
  document.getElementById('emptyState').style.display = (active.length + sold.length) ? 'none' : 'block';

  active.forEach(c => tbody.appendChild(buildRow(c, false)));
  if (sold.length > 0) {
    const divider = document.createElement('tr');
    divider.className = 'sold-divider';
    const dtd = document.createElement('td');
    dtd.colSpan = columns.length;
    dtd.textContent = '-- 已售出 (' + sold.length + ') --';
    divider.appendChild(dtd);
    tbody.appendChild(divider);
    sold.forEach(c => tbody.appendChild(buildRow(c, true)));
  }
}

function updateStats(filtered) {
  const all = filtered;
  const held = all.filter(c => !isSold(c));
  const sold = all.filter(c => isSold(c));
  const heldCost = held.reduce((s,c) => s + (c.cost_cny || 0), 0);
  const soldCost = sold.reduce((s,c) => s + (c.cost_cny || 0), 0);
  const soldRevenue = sold.reduce((s,c) => s + (c.sold_price || 0), 0);
  const totalProfit = soldRevenue - soldCost;

  const stats = [
    {label:'总卡数', value: all.length, sub: '持有 ' + held.length + ' / 已售 ' + sold.length},
    {label:'持仓成本', value: fmtMoney(heldCost), sub: '未售出卡片总成本'},
    {label:'卖出成本', value: fmtMoney(soldCost), sub: '已售卡片购入成本'},
    {label:'卖出收入', value: fmtMoney(soldRevenue), sub: '已售卡片成交总额'},
    {label:'已实现利润', value: fmtMoney(totalProfit), sub: '收入 - 成本', cls: totalProfit >= 0 ? 'profit-pos' : 'profit-neg'},
    {label:'香香 / 小桃子', value: all.filter(c=>c.buyer==='香香').length + ' / ' + all.filter(c=>c.buyer==='小桃子').length,
     sub: fmtMoney(all.filter(c=>c.buyer==='香香').reduce((s,c)=>s+(c.cost_cny||0),0)) + ' / ' + fmtMoney(all.filter(c=>c.buyer==='小桃子').reduce((s,c)=>s+(c.cost_cny||0),0))},
  ];

  document.getElementById('statsRow').innerHTML = stats.map(s =>
    '<div class="stat-card"><div class="label">' + s.label + '</div><div class="value ' + (s.cls||'') + '">' + s.value + '</div><div class="sub">' + s.sub + '</div></div>'
  ).join('');
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  const isSettle = tab === 'settle';
  document.getElementById('mainControls').style.display = isSettle ? 'none' : 'flex';
  document.querySelector('.table-wrap').style.display = isSettle ? 'none' : 'block';
  document.getElementById('settlePage').style.display = isSettle ? 'block' : 'none';
  if (isSettle) renderSettlePage();
  else renderTable();
}

// ==================== SETTLEMENT PAGE ====================
function renderSettlePage() {
  const sold = cards.filter(c => isSold(c));

  // Stats
  let totalProfit = 0, settledProfit = 0, unsettledProfit = 0;
  let xxOwed = 0, xtzOwed = 0; // unsettled amounts owed to each

  sold.forEach(c => {
    const profit = (c.sold_price || 0) - (c.cost_cny || 0);
    totalProfit += profit;
    if (c.settled) {
      settledProfit += profit;
    } else {
      unsettledProfit += profit;
      // Buyer gets back cost, profit split 50/50
      const halfProfit = profit / 2;
      if (c.buyer === '香香') {
        xxOwed += c.cost_cny + halfProfit;   // 香香 gets back cost + half profit
        xtzOwed += halfProfit;               // 小桃子 gets half profit
      } else if (c.buyer === '小桃子') {
        xtzOwed += c.cost_cny + halfProfit;
        xxOwed += halfProfit;
      } else {
        // No buyer assigned - split everything 50/50
        xxOwed += (c.sold_price || 0) / 2;
        xtzOwed += (c.sold_price || 0) / 2;
      }
    }
  });

  const settledCount = sold.filter(c => c.settled).length;
  const unsettledCount = sold.length - settledCount;

  document.getElementById('settleStats').innerHTML = [
    {label:'已售总数', value: sold.length, sub: '已结算 ' + settledCount + ' / 未结算 ' + unsettledCount},
    {label:'总利润', value: fmtMoney(totalProfit), sub: '所有已售卡片', cls: totalProfit >= 0 ? 'profit-pos' : 'profit-neg'},
    {label:'未结算利润', value: fmtMoney(unsettledProfit), sub: '待分配', cls: unsettledProfit >= 0 ? 'profit-pos' : 'profit-neg'},
    {label:'香香应得', value: fmtMoney(xxOwed), sub: '未结算部分（含本金回收）'},
    {label:'小桃子应得', value: fmtMoney(xtzOwed), sub: '未结算部分（含本金回收）'},
  ].map(s =>
    '<div class="stat-card"><div class="label">' + s.label + '</div><div class="value ' + (s.cls||'') + '">' + s.value + '</div><div class="sub">' + s.sub + '</div></div>'
  ).join('');

  // Table rows
  const tbody = document.getElementById('settleBody');
  tbody.innerHTML = '';
  sold.forEach(c => {
    const profit = (c.sold_price || 0) - (c.cost_cny || 0);
    const halfProfit = profit / 2;
    let buyerRecov = 0, xxShare = 0, xtzShare = 0;
    if (c.buyer === '香香') {
      buyerRecov = c.cost_cny || 0;
      xxShare = halfProfit;
      xtzShare = halfProfit;
    } else if (c.buyer === '小桃子') {
      buyerRecov = c.cost_cny || 0;
      xxShare = halfProfit;
      xtzShare = halfProfit;
    } else {
      buyerRecov = 0;
      xxShare = (c.sold_price || 0) / 2;
      xtzShare = (c.sold_price || 0) / 2;
    }

    const tr = document.createElement('tr');
    if (c.settled) tr.style.opacity = '0.5';

    // Checkbox
    const tdCheck = document.createElement('td');
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = !!c.settled;
    cb.onchange = () => updateCard(c.id, { settled: cb.checked }).then(() => renderSettlePage());
    tdCheck.appendChild(cb);
    tr.appendChild(tdCheck);

    // Data cells
    const cells = [
      c.id,
      c.player,
      c.series || '-',
      c.buyer ? '<span class="badge ' + (c.buyer === '香香' ? 'badge-xx' : 'badge-xtz') + '">' + c.buyer + '</span>' : '-',
      c.source || '-',
      fmtCost(c, 'cost_cny', c.cost_cny),
      fmtMoney(c.sold_price),
      fmtMoney(profit),
      fmtMoney(buyerRecov),
      fmtMoney(xxShare),
      fmtMoney(xtzShare),
      c.settled ? '<span class="badge badge-sold">已结算</span>' : '<span class="badge badge-holding">未结算</span>',
    ];
    cells.forEach(html => {
      const td = document.createElement('td');
      td.innerHTML = html;
      tr.appendChild(td);
    });

    // Color the profit cell
    const profitTd = tr.children[8]; // 0=check,1=id,2=player,3=series,4=buyer,5=source,6=cost,7=sold,8=profit
    if (profit >= 0) profitTd.className = 'profit-cell-pos';
    else profitTd.className = 'profit-cell-neg';

    tbody.appendChild(tr);
  });
}

loadCards();
